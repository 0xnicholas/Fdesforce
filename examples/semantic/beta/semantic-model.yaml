    modules:
      - ref: kyc-ontology@1.0.0
        source: template
        digest: sha256:4444444444444444444444444444444444444444444444444444444444444444
    extensions: []
  sources:
    - ref: beta-dms
      contextSource: context-sources/beta-dms.yaml
