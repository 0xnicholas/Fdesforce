    - ref: mappings/core-banking.yaml
  resolution:
    keys:
      Customer: [customer_id]
      KYCReview: [review_id]
    sourcePrecedence:
      Customer: [core-banking, beta-dms]
    merge:
      strategy: same_as
      minConfidence: 0.9
  freshness:
    defaultStaleAfter: PT12H
    perSource:
      core-banking: PT1H
      beta-dms: PT12H
  recipes:
    - ref: recipes/kyc-context.yaml
  permissions:
    ref: permissions.yaml
  evals:
