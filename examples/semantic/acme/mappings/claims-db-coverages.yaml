# Acme claims-db coverages: the limits a claim is paid against.
apiVersion: fde.dev/v0
kind: EntityMapping
metadata:
  customer: acme
  source: claims-db
spec:
  connectorRef: claims-db
  dataset: public.coverages
  entity: "ic:Coverage"
  key: [coverage_id]
  properties:
    coverage_type: {property: "ic:coverageType", type: string}
    coverage_limit: {property: "ic:coverageLimit", type: decimal}
  relations: []
  watermark:
    column: updated_at
    mode: updated_at
  filters:
    - "tenant_id = :tenant_id"
