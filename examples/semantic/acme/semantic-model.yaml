apiVersion: fde.dev/v0
kind: SemanticModel
metadata:
  customer: acme
  name: acme-claims
  version: 1.0.0
spec:
  ontology:
    modules:
      - ref: insurance-claims@1.0.0
        source: template
        digest: sha256:64041739ee5f53f30525ef1d10e561bdd5d39c9b0b2d853df1482a097935c2ed
    extensions:
      - path: ontology/acme-claims-extension.ttl
        digest: sha256:c7d8df65f03df7fe2485405afb603f79a229e9817aeb7d4554fad504d67b76c1
      - path: ontology/acme-claims.shacl.ttl
        digest: sha256:bc08c2e0495a95b11a12fa058a51842bb784a34ef3c1a6911c50fd7dcff68c46
  sources:
    - ref: claims-db
      contextSource: context-sources/claims-db.yaml
    - ref: sharepoint-claims
      contextSource: context-sources/sharepoint-claims.yaml
  entityMappings:
    - ref: mappings/claims-db.yaml
    - ref: mappings/claims-db-policies.yaml
    - ref: mappings/claims-db-coverages.yaml
    - ref: mappings/claims-db-customers.yaml
    - ref: mappings/sharepoint-claims.yaml
  resolution:
    keys:
      Claim: [claim_id]
      Policy: [policy_number]
      Customer: [customer_id]
    sourcePrecedence:
      Claim: [claims-db, sharepoint-claims]
      Policy: [claims-db, sharepoint-claims]
    merge:
      strategy: same_as
      minConfidence: 0.8
  freshness:
    defaultStaleAfter: PT24H
    perSource:
      claims-db: PT1H
      sharepoint-claims: PT24H
  recipes:
    - ref: recipes/claims-context.yaml
  permissions:
    ref: permissions.yaml
  evals:
    - ref: evals/claims-context.golden.yaml
