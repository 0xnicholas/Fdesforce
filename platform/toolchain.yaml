# Platform artifact — the pinned build toolchain.
#
# `fde spec lock` copies this into `solution.lock.toolchain` and folds the
# Dockerfile content digest into the image reference. Until #33 publishes the
# toolchain image, that digest is the content address of `toolchain/Dockerfile`,
# not a registry manifest digest: it is recomputable offline and changes exactly
# when the toolchain changes.
apiVersion: fde.dev/v0
kind: Toolchain
metadata:
  name: fde-slice1-toolchain
  version: 0.1.0
spec:
  generator: 0.1.0
  image: ghcr.io/fde-workbench/toolchain
  dockerfile: toolchain/Dockerfile
  # Cross-runtime versions that no single Runtime Profile owns.
  versions:
    node: 22.13.0
    python: 3.12.2
    semantica: 0.7.0
    contextService: 0.1.0
  # The volume schemas `python -m app.migrate` establishes. audit 1 gained the
  # `approval` table in #40 without a version bump: the stamp is the evidence
  # *format* the frozen Context Package declares compatibility with, and the new
  # table is additive state the service refuses to serve until `migrate` creates it
  # (`REQUIRED_OBJECTS`), so an unprepared volume still fails closed (§9.2).
  schemas:
    graph: 1
    audit: 1
  # Which vendored `platform/context-service/<version>` fragment this toolchain
  # composes. Pinning it here keeps `fde build` from picking "whatever is newest".
  contextServiceTopology: 1.1.0
